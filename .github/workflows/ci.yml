name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Lint, test en typecheck in één job → één VM, geen dubbele setup-overhead.
  lint-test-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev + mypy)
        run: pip install -e ".[dev]" "mypy>=1.8.0"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: mypy src/rangebot --ignore-missing-imports
