name: Dagelijks Portfoliorapport (Kraken USD)
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Herstel Kraken trade state (fee-tracking)
        uses: actions/cache@v4
        with:
          path: .kraken_trade_state.json
          key: kraken-daily-report-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kraken-trade-state-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Stuur dagelijks portfoliorapport
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m rangebot.live.daily_report
