name: Daily Status
on:
  schedule:
    - cron: '0 9 * * *'   # Elke dag om 9:00 UTC (10:00/11:00 NL)
  workflow_dispatch:       # Handmatig testen
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      # Leest data/kraken_equity.csv (gecommit door elke trade-run): ⚠️ bij oude run,
      # >10% onder piek of pauze; anders ✅ met kerncijfers.
      - name: Heartbeat
        env:
          KRAKEN_TRADING_PAUSED: ${{ vars.KRAKEN_TRADING_PAUSED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m rangebot.live.health_check
