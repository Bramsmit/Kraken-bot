# Uurlijk (UTC): zelfde bestandsnaam en cadans als de oude Alpaca `trade.yml`.
# Cron: minuut 0 van elk uur → 00:00, 01:00, 02:00 … UTC.
# Geplande runs alleen op de default branch. Actions moet aan staan onder repo Settings.
name: Hourly — Kraken trade

run-name: Hourly Kraken — ${{ github.event_name }}

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      clean_slate:
        description: Annuleer open orders en reset trade state (eenmalig)
        required: false
        default: false
        type: boolean

concurrency:
  group: kraken-hourly-trade
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # upload-artifact (journals)

jobs:
  hourly-kraken-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pip-cache: hergebruikt geïnstalleerde packages zolang pyproject.toml niet wijzigt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Trade-state cache: persisteert notified_trade_ids en entries tussen runs.
      # Journals blijven ook in data/ (git); cache dekt ephemeral root-bestanden.
      - uses: actions/cache@v4
        with:
          path: |
            .kraken_trade_state.json
            .kraken_api_nonce
            kraken_trades.jsonl
            kraken_runs.jsonl
            kraken_bot_trades.jsonl
          key: kraken-trade-state-${{ runner.os }}
          restore-keys: |
            kraken-trade-state-${{ runner.os }}

      - name: Install dependencies
        run: pip install -e .

      - name: Clean slate (handmatige run)
        if: github.event_name == 'workflow_dispatch' && inputs.clean_slate
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: python -m rangebot.live.clean_slate

      # Live limits: set repository variable KRAKEN_DRY_RUN=false. Unset/empty/true = dry-run (default in app).
      - name: Run Kraken range bot
        id: kraken_trade
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          KRAKEN_DRY_RUN: ${{ vars.KRAKEN_DRY_RUN }}
          KRAKEN_POST_ONLY: ${{ vars.KRAKEN_POST_ONLY || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m kraken.live_trader

      - name: Export en bewaar trade-log in repo
        if: always()
        continue-on-error: true
        run: |
          python -m rangebot.live.export_trade_log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main 2>/dev/null || true
          git add data/kraken_trades.jsonl data/kraken_trades.csv
          if git diff --cached --quiet; then
            echo "Geen nieuwe trades, skip push."
            exit 0
          fi
          git commit -m "chore: trade log $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD; then
              echo "Push geslaagd (poging $attempt)."
              exit 0
            fi
            echo "Push poging $attempt mislukt, rebase en opnieuw..."
            git pull --rebase origin main 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "⚠️  Push na 3 pogingen mislukt; data blijft in cache/artifact."
          exit 1

      - name: Upload Kraken journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kraken-journals-${{ github.run_id }}
          path: |
            kraken_trades.jsonl
            kraken_runs.jsonl
            kraken_bot_trades.jsonl
            data/kraken_trades.jsonl
            data/kraken_trades.csv
            .kraken_trade_state.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Kraken range-bot gefaald. Check GitHub Actions."
